name: Build & Test NADA KASIR CUSTOM

# Jalan otomatis setiap push/PR ke main, dan bisa dipicu manual dari tab Actions
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_demo:
        description: 'Ikut build APK DEMO juga? (build jadi sekitar 2x lebih lama)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Beri izin eksekusi gradlew
        run: chmod +x gradlew

      - name: Jalankan Unit Test (Phase 1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ./gradlew testDemoDebugUnitTest --no-daemon --stacktrace > build.log 2>&1; then
            cat build.log
            ERR=$(tail -n 60 build.log)
            gh api /repos/angga9912/Nada_Pos/issues/1/comments -f body="Build failure:
            \`\`\`
            $ERR
            \`\`\`" || true
            exit 1
          fi

      - name: Build APK Debug (flavor demo)
        run: ./gradlew assembleDemoDebug --no-daemon
        
      - name: Cek APK yang berhasil dibuild (debug)
        run: find app/build/outputs/apk -name "*.apk" -print

      - name: Rename APK jadi NadaPOS.apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/demo/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "GAGAL: tidak ada file APK ditemukan di app/build/outputs/apk/demo/debug/"
            exit 1
          fi
          echo "Ditemukan: $APK_PATH"
          mv "$APK_PATH" app/build/outputs/apk/demo/debug/NadaPOS.apk

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: nada-kasir-custom-demo-debug
          path: app/build/outputs/apk/demo/debug/*.apk
          if-no-files-found: error

      - name: Upload laporan unit test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  # Job kecil khusus untuk MENGECEK apakah secret keystore sudah di-setup, hasilnya
  # dititipkan lewat "outputs" job supaya bisa dibaca di "if:" job build-release di bawah.
  # Ini akal-akalan resmi yang direkomendasikan GitHub sendiri, karena "secrets" ATAU "env"
  # sama-sama TIDAK BISA dipakai langsung di "if:" level JOB (beda dengan level step).
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_keystore: ${{ steps.cek.outputs.has_keystore }}
    steps:
      - id: cek
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

  # Job build APK RELEASE yang sudah ditandatangani (poin perbaikan #2) - OTOMATIS
  # DILEWATI kalau secret keystore belum di-setup (lihat check-secrets di atas), supaya
  # tidak mengganggu job "build" di atas yang selalu jalan untuk testing sehari-hari.
  #
  # Cara mengaktifkan job ini:
  # 1. Generate keystore lewat tools/generate_keystore.sh di komputer Anda.
  # 2. Encode ke base64: base64 -i release.keystore | tr -d '\n' > keystore_base64.txt
  # 3. Di GitHub: Settings > Secrets and variables > Actions, tambahkan:
  #    KEYSTORE_BASE64 (isi dari keystore_base64.txt), KEYSTORE_PASSWORD, KEY_ALIAS,
  #    dan KEY_PASSWORD. (Lisensi tidak butuh secret di build: cukup file license.public di repo.)
  build-release:
    needs: check-secrets
    runs-on: ubuntu-latest
    if: needs.check-secrets.outputs.has_keystore == 'true'

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Lisensi memakai kunci PUBLIK di file license.public (ada di repo) - tanpa itu APK tidak
      # bisa mengaktifkan kode apapun, jadi build dihentikan supaya tidak lolos tanpa disadari.
      - name: Pastikan license.public ada
        run: |
          if [ ! -s license.public ]; then
            echo "GAGAL: license.public tidak ada di root repo. Jalankan 'python3 tools/generate_license.py --init' lalu upload license.public."
            exit 1
          fi

      - name: Setup keystore dari GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Beri izin eksekusi gradlew
        run: chmod +x gradlew

      # R8 (obfuscation) aktif di build release: proses ini lebih lama dari build debug.
      # APK FULL selalu dibuild. APK DEMO hanya kalau dicentang saat "Run workflow" manual
      # (build otomatis dari push tidak membuild demo, supaya lebih cepat).
      - name: Build APK Release yang sudah ditandatangani
        env:
          BUILD_DEMO: ${{ inputs.build_demo }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TASKS="assembleFullRelease"
          if [ "$BUILD_DEMO" = "true" ]; then
            TASKS="$TASKS assembleDemoRelease"
          fi
          echo "Menjalankan: $TASKS"
          if ! ./gradlew $TASKS --no-daemon --stacktrace > release_build.log 2>&1; then
            cat release_build.log
            ERR=$(tail -n 60 release_build.log)
            gh api /repos/angga9912/Nada_Pos/issues/1/comments -f body="Release build failure:
            \`\`\`
            $ERR
            \`\`\`" || true
            exit 1
          fi

      - name: Rename APK jadi NadaPOS.apk
        env:
          BUILD_DEMO: ${{ inputs.build_demo }}
        run: |
          FLAVORS="full"
          if [ "$BUILD_DEMO" = "true" ]; then
            FLAVORS="full demo"
          fi
          for FLAVOR in $FLAVORS; do
            DIR=app/build/outputs/apk/$FLAVOR/release
            APK_PATH=$(find "$DIR" -name "*.apk" | head -n 1)
            if [ -z "$APK_PATH" ]; then
              echo "GAGAL: tidak ada file APK ditemukan di $DIR/"
              exit 1
            fi
            echo "Ditemukan: $APK_PATH"
            mv "$APK_PATH" "$DIR/NadaPOS.apk"
          done

      - name: Upload APK Release FULL sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: nada-pos-full-release-signed
          path: app/build/outputs/apk/full/release/NadaPOS.apk
          if-no-files-found: error

      - name: Upload APK Release DEMO sebagai artifact
        if: ${{ inputs.build_demo }}
        uses: actions/upload-artifact@v4
        with:
          name: nada-pos-demo-release-signed
          path: app/build/outputs/apk/demo/release/NadaPOS.apk
          if-no-files-found: error

      # mapping.txt = "kunci" untuk membaca kembali nama asli dari crash log (SIMPAN tiap rilis,
      # jangan dibagikan ke pelanggan). Kalau R8 gagal, di sini juga ada missing_rules.txt
      # (daftar aturan yang kurang) - kirim file itu untuk diperbaiki.
      - name: Upload mapping R8 & log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-dan-log
          path: app/build/outputs/mapping/
          if-no-files-found: warn
