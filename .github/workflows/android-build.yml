name: Build & Test NADA KASIR CUSTOM

# Jalan otomatis setiap push/PR ke main, dan bisa dipicu manual dari tab Actions
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # CATATAN TEKNIS: "secrets" tidak boleh dipakai langsung di dalam "if:" -
      # ini batasan resmi GitHub Actions (bukan bug kita). Solusinya: titipkan dulu
      # ke "env:" di step yang sama, baru dicek lewat "env." di "if:" step itu.
      - name: Setup license.secret dari GitHub Secrets
        if: ${{ env.NADA_LICENSE_SECRET != '' }}
        env:
          NADA_LICENSE_SECRET: ${{ secrets.NADA_LICENSE_SECRET }}
        run: echo "$NADA_LICENSE_SECRET" > license.secret

      - name: Beri izin eksekusi gradlew
        run: chmod +x gradlew

      - name: Jalankan Unit Test (Phase 1)
        run: ./gradlew testDemoDebugUnitTest --no-daemon

      - name: Build APK Debug (flavor demo)
        run: ./gradlew assembleDemoDebug --no-daemon

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: nada-kasir-custom-demo-debug
          path: app/build/outputs/apk/demo/debug/*.apk
          if-no-files-found: error

      - name: Upload laporan unit test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  # Job kecil khusus untuk MENGECEK apakah secret keystore sudah di-setup, hasilnya
  # dititipkan lewat "outputs" job supaya bisa dibaca di "if:" job build-release di bawah.
  # Ini akal-akalan resmi yang direkomendasikan GitHub sendiri, karena "secrets" ATAU "env"
  # sama-sama TIDAK BISA dipakai langsung di "if:" level JOB (beda dengan level step).
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_keystore: ${{ steps.cek.outputs.has_keystore }}
    steps:
      - id: cek
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

  # Job build APK RELEASE yang sudah ditandatangani (poin perbaikan #2) - OTOMATIS
  # DILEWATI kalau secret keystore belum di-setup (lihat check-secrets di atas), supaya
  # tidak mengganggu job "build" di atas yang selalu jalan untuk testing sehari-hari.
  #
  # Cara mengaktifkan job ini:
  # 1. Generate keystore lewat tools/generate_keystore.sh di komputer Anda.
  # 2. Encode ke base64: base64 -i release.keystore | tr -d '\n' > keystore_base64.txt
  # 3. Di GitHub: Settings > Secrets and variables > Actions, tambahkan:
  #    KEYSTORE_BASE64 (isi dari keystore_base64.txt), KEYSTORE_PASSWORD, KEY_ALIAS,
  #    KEY_PASSWORD, dan NADA_LICENSE_SECRET (isi file license.secret Anda).
  build-release:
    needs: check-secrets
    runs-on: ubuntu-latest
    if: needs.check-secrets.outputs.has_keystore == 'true'

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup license.secret dari GitHub Secrets
        env:
          NADA_LICENSE_SECRET: ${{ secrets.NADA_LICENSE_SECRET }}
        run: echo "$NADA_LICENSE_SECRET" > license.secret

      - name: Setup keystore dari GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Beri izin eksekusi gradlew
        run: chmod +x gradlew

      - name: Build APK Release yang sudah ditandatangani (flavor demo)
        run: ./gradlew assembleDemoRelease --no-daemon
        
      - name: Rename APK jadi NadaPOS.apk
        run: mv app/build/outputs/apk/demo/debug/*.apk app/build/outputs/apk/demo/debug/NadaPOS.apk
        
      - name: Upload APK Release sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: nada-pos-demo-release-signed
          path: app/build/outputs/apk/demo/release/*.apk
          if-no-files-found: error
